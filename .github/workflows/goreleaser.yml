name: goreleaser

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: meltify-release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.repository, '-internal') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      NFPM_GPG_KEY: ${{ secrets.NFPM_GPG_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          existing_head_tag="$(git tag --points-at HEAD -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$existing_head_tag" ]; then
            echo "tag=$existing_head_tag" >> "$GITHUB_OUTPUT"
            echo "Using existing tag on HEAD: $existing_head_tag"
            exit 0
          fi

          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            patch="$((patch + 1))"
            next="v${major}.${minor}.${patch}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$next" -m "Release $next"
          git push origin "$next"

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Created tag: $next"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: true
          check-latest: true

      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0.21.1

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        name: ghcr.io login
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write nfpm GPG key
        if: ${{ env.NFPM_GPG_KEY != '' }}
        run: |
          echo "$NFPM_GPG_KEY" > "${{ runner.temp }}/gpg.key"

      - uses: samuelmeuli/action-snapcraft@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NFPM_DEFAULT_PASSPHRASE: ${{ secrets.NFPM_DEFAULT_PASSPHRASE }}
          GPG_KEY_PATH: ${{ runner.temp }}/gpg.key
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

      - name: Send Matrix notification
        if: ${{ success() && env.MATRIX_ACCESS_TOKEN != '' }}
        uses: s3krit/matrix-message-action@v0.0.3
        with:
          room_id: '!rJPcAEYjzlSUoYDjxc:ft.hn'
          access_token: ${{ env.MATRIX_ACCESS_TOKEN }}
          server: 'matrix.ft.hn'
          message: |
            **meltify ${{ steps.version.outputs.tag }}** is now available.

            [View release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }})

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          retention-days: 30
          name: dist
          path: |
            dist

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
