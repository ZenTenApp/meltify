# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: meltify

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run ./cmd/meltify completion "bash" >./completions/meltify.bash'
    - sh -c 'go run ./cmd/meltify completion "zsh" >./completions/meltify.zsh'
    - sh -c 'go run ./cmd/meltify completion "fish" >./completions/meltify.fish'
    - sh -c 'go run ./cmd/meltify man | gzip -c >./manpages/meltify.1.gz'
    - sh -c 'go run ./cmd/meltify-brave completion "bash" >./completions/meltify-brave.bash'
    - sh -c 'go run ./cmd/meltify-brave completion "zsh" >./completions/meltify-brave.zsh'
    - sh -c 'go run ./cmd/meltify-brave completion "fish" >./completions/meltify-brave.fish'
    - sh -c 'go run ./cmd/meltify-brave man | gzip -c >./manpages/meltify-brave.1.gz'
    - sh -c 'go run ./cmd/meltify-beldex completion "bash" >./completions/meltify-beldex.bash'
    - sh -c 'go run ./cmd/meltify-beldex completion "zsh" >./completions/meltify-beldex.zsh'
    - sh -c 'go run ./cmd/meltify-beldex completion "fish" >./completions/meltify-beldex.fish'
    - sh -c 'go run ./cmd/meltify-beldex man | gzip -c >./manpages/meltify-beldex.1.gz'

gomod:
  proxy: false

builds:
  - &meltify_build
    id: meltify
    main: ./cmd/meltify
    binary: meltify
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
  - <<: *meltify_build
    id: meltify-brave
    main: ./cmd/meltify-brave
    binary: meltify-brave
  - <<: *meltify_build
    id: meltify-beldex
    main: ./cmd/meltify-beldex
    binary: meltify-beldex

archives:
  - id: default
    ids:
      - meltify
      - meltify-brave
      - meltify-beldex
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      meltify_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm}}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*

nfpms:
  - ids:
      - meltify
      - meltify-brave
      - meltify-beldex
    vendor: ZenTenApp
    file_name_template: >-
      {{- trimsuffix .ConventionalFileName .ConventionalExtension -}}
      {{- if and (eq .Arm "6") (eq .ConventionalExtension ".deb") }}6{{ end -}}
      {{- .ConventionalExtension -}}
    formats:
      - apk
      - deb
      - rpm
    contents:
      - src: ./completions/meltify.bash
        dst: /etc/bash_completion.d/meltify
      - src: ./completions/meltify.fish
        dst: /usr/share/fish/vendor_completions.d/meltify.fish
      - src: ./completions/meltify.zsh
        dst: /usr/share/zsh/site-functions/_meltify
      - src: ./manpages/meltify.1.gz
        dst: /usr/share/man/man1/meltify.1.gz
      - src: ./completions/meltify-brave.bash
        dst: /etc/bash_completion.d/meltify-brave
      - src: ./completions/meltify-brave.fish
        dst: /usr/share/fish/vendor_completions.d/meltify-brave.fish
      - src: ./completions/meltify-brave.zsh
        dst: /usr/share/zsh/site-functions/_meltify-brave
      - src: ./manpages/meltify-brave.1.gz
        dst: /usr/share/man/man1/meltify-brave.1.gz
      - src: ./completions/meltify-beldex.bash
        dst: /etc/bash_completion.d/meltify-beldex
      - src: ./completions/meltify-beldex.fish
        dst: /usr/share/fish/vendor_completions.d/meltify-beldex.fish
      - src: ./completions/meltify-beldex.zsh
        dst: /usr/share/zsh/site-functions/_meltify-beldex
      - src: ./manpages/meltify-beldex.1.gz
        dst: /usr/share/man/man1/meltify-beldex.1.gz
    rpm:
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'

brews:
  - repository:
      owner: ZenTenApp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ZenTenApp/meltify"
    description: "Export compact Nostr/SSH/MELT seed material from Ed25519 OpenSSH keys"
    license: "MIT"
    goarm: 7
    install: |-
      bin.install "meltify"
      bin.install "meltify-brave"
      bin.install "meltify-beldex"
      bash_completion.install "completions/meltify.bash" => "meltify"
      bash_completion.install "completions/meltify-brave.bash" => "meltify-brave"
      bash_completion.install "completions/meltify-beldex.bash" => "meltify-beldex"
      zsh_completion.install "completions/meltify.zsh" => "_meltify"
      zsh_completion.install "completions/meltify-brave.zsh" => "_meltify-brave"
      zsh_completion.install "completions/meltify-beldex.zsh" => "_meltify-beldex"
      fish_completion.install "completions/meltify.fish"
      fish_completion.install "completions/meltify-brave.fish"
      fish_completion.install "completions/meltify-beldex.fish"
      man1.install "manpages/meltify.1.gz"
      man1.install "manpages/meltify-brave.1.gz"
      man1.install "manpages/meltify-beldex.1.gz"

scoops:
  - repository:
      owner: ZenTenApp
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ZenTenApp/meltify"
    license: "MIT"

nix:
  - repository:
      owner: ZenTenApp
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      name: nur
    install: |-
      mkdir -p $out/bin
      cp -vr ./meltify $out/bin/meltify
      cp -vr ./meltify-brave $out/bin/meltify-brave
      cp -vr ./meltify-beldex $out/bin/meltify-beldex
    extra_install: |-
      installManPage ./manpages/meltify.1.gz
      installManPage ./manpages/meltify-brave.1.gz
      installManPage ./manpages/meltify-beldex.1.gz
      installShellCompletion ./completions/*

checksum:
  name_template: 'meltify_{{ .Version }}_checksums.txt'

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }}{{ end }})"
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "Deps"
      regexp: "^.*\\(deps\\)*:+.*$"
      order: 300
    - title: "New!"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Fixed"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Docs"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: "Other stuff"
      order: 9999

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

dockers_v2:
  - id: meltify
    ids:
      - meltify
      - meltify-brave
      - meltify-beldex
    dockerfile: Dockerfile
    images:
      - ghcr.io/zentenapp/meltify
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7

git:
  tag_sort: "-version:refname"

release:
  github:
    owner: ZenTenApp
    name: meltify
  mode: replace
  header: |
    ## meltify {{ .Tag }}
    
    {{ .ReleaseNotes }}
  footer: |
    ---
    
    **Full Changelog**: https://github.com/ZenTenApp/meltify/compare/{{ .PreviousTag }}...{{ .Tag }}
