name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          # config verify fetches the JSON schema from golangci-lint.run, which
          # can time out on CI runners; golangci-lint run still fails loudly on a
          # malformed config.
          verify: false
          args: --config .golangci.yml
